<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B案 しずかな一軒家 — こあがり</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F2E9;--ink:#33302B;--sub:#8B857B;--green:#4E6B4A;
  --sans:"M PLUS Rounded 1c",-apple-system,"Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-weight:500;line-height:1.9;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}

.top{display:flex;align-items:flex-start;padding:30px 40px 0}
.mark{position:relative;background:var(--green);color:#fff;padding:20px 22px 26px;border-radius:4px 4px 4px 26px;
  font-weight:900;font-size:1.05rem;line-height:1.35;text-align:center;letter-spacing:.02em}
.top .sp{flex:1}
.top .r{display:flex;gap:22px;font-size:.78rem;font-weight:800;color:var(--sub);letter-spacing:.06em;padding-top:8px}

.stage{display:flex;justify-content:center;padding:34px 40px 0;position:relative}
.frame{max-width:720px;width:100%;position:relative}
.frame img{width:100%;display:block;border-radius:2px}
.vert{position:absolute;right:-52px;top:8px;writing-mode:vertical-rl;font-size:.82rem;font-weight:700;
  letter-spacing:.34em;color:var(--sub);line-height:1}
@media(max-width:900px){.vert{display:none}}

.mid{text-align:center;padding:54px 40px 0}
.mid h1{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:700;letter-spacing:.02em;line-height:1.9}
.mid p{color:var(--sub);font-size:.94rem;margin-top:22px;line-height:2.1}
.rule{width:36px;height:1px;background:#CFC7B6;margin:34px auto}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:760px;margin:0 auto;padding:0 40px 64px}
@media(max-width:700px){.three{grid-template-columns:1fr;gap:26px}}
.three div{text-align:center;padding:0 18px;border-right:1px solid #E4DDCE}
.three div:last-child{border:none}
@media(max-width:700px){.three div{border:none}}
.three b{display:block;font-size:.72rem;font-weight:900;letter-spacing:.2em;color:var(--green);margin-bottom:8px}
.three span{font-size:.9rem;color:var(--sub)}

.cta{text-align:center;padding-bottom:70px}
.cta a{display:inline-block;border:1px solid var(--ink);border-radius:0;padding:15px 46px;
  font-size:.86rem;font-weight:800;letter-spacing:.14em}
</style></head><body>
<div class="top">
  <div class="mark">こあがり<br><span style="font-size:.6rem;letter-spacing:.2em;font-weight:700">KOAGARI</span></div>
  <div class="sp"></div>
  <div class="r"><span>ABOUT</span><span>USE</span><span>PRICE</span><span>ACCESS</span></div>
</div>

<div class="stage">
  <div class="frame">
    <img src="../room.svg" alt="畳の小上がりのある部屋">
    <div class="vert">畳の小上がりのある、ちいさな貸し空間</div>
  </div>
</div>

<div class="mid">
  <h1>ここは、<br>だれかの「いつもの場所」。</h1>
  <p>お店を持つ前の人が、はじめてのお客さんを迎える部屋。<br>
  すこし集まりたい人が、気をつかわずに座れる部屋。<br>
  一軒家の1階を、1時間からお貸ししています。</p>
  <div class="rule"></div>
</div>

<div class="three">
  <div><b>SPACE</b><span>畳の小上がり＋6畳<br>ゆったり4〜6名</span></div>
  <div><b>PRICE</b><span>1時間 1,000円<br>3時間 2,700円</span></div>
  <div><b>USE</b><span>施術・教室・集まり<br>撮影・上映会</span></div>
</div>

<div class="cta"><a>空き状況をみる</a></div>
</body></html>
