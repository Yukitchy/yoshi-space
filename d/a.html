<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A案 その日の風景 — こあがり</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#241F1A;--sans:"M PLUS Rounded 1c",-apple-system,"Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-weight:500;line-height:1.75;color:var(--ink);background:#241F1A}
.nb{display:inline-block;white-space:nowrap}
a{color:inherit;text-decoration:none}

.hero{position:relative;min-height:660px;display:flex;flex-direction:column;overflow:hidden;background:#241F1A}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:center 55%}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,31,26,.42) 0%,rgba(36,31,26,.08) 30%,rgba(36,31,26,.55) 62%,rgba(36,31,26,.88) 100%)}

.top{position:relative;display:flex;align-items:center;gap:20px;padding:22px 40px;color:#fff}
.logo{font-weight:900;font-size:1.2rem;letter-spacing:-.02em}
.logo small{display:block;font-size:.6rem;font-weight:700;opacity:.7;letter-spacing:.16em;line-height:1}
.top .sp{flex:1}
.top a{font-size:.84rem;font-weight:800;opacity:.85}

.mid{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 40px 42px;color:#fff}
.tagline{font-size:.8rem;font-weight:800;letter-spacing:.14em;opacity:.85;margin-bottom:14px}
h1{font-size:clamp(2.4rem,5.6vw,4.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.18;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.sub{font-size:1.02rem;opacity:.9;margin-top:16px;max-width:32em}

.bar{position:relative;background:#fff;border-radius:18px;margin:26px 40px 0;padding:14px;display:flex;gap:8px;align-items:center;
  box-shadow:0 18px 44px rgba(0,0,0,.28);flex-wrap:wrap}
.cell{flex:1;min-width:130px;padding:6px 16px;border-right:1px solid #EBE6DC}
.cell:last-of-type{border:none}
.cell b{display:block;font-size:.7rem;font-weight:900;letter-spacing:.06em;color:#8C8378}
.cell span{font-size:.94rem;font-weight:800}
.go{background:#E2643B;color:#fff;font-weight:900;padding:15px 30px;border-radius:12px;font-size:.95rem;white-space:nowrap}

.strip{background:#241F1A;color:#fff;padding:26px 40px 40px;display:flex;gap:34px;flex-wrap:wrap;align-items:center}
.strip .it{display:flex;gap:11px;align-items:center;font-size:.88rem;font-weight:700;opacity:.9}
.strip .it b{font-family:"Lilita One",var(--sans);font-size:1.5rem;color:#F5B34A;letter-spacing:0}
@media(max-width:700px){.top,.mid{padding-left:22px;padding-right:22px}.bar{margin:20px 22px 0}.strip{padding:22px}}
</style></head><body>
<div class="hero">
  <div class="bg"><img src="../room-wide.svg" alt="畳の小上がりのある部屋"></div>
  <div class="veil"></div>
  <div class="top">
    <div class="logo">こあがり<small>KOAGARI SPACE</small></div>
    <div class="sp"></div><a>つかいかた</a><a>料金</a><a>アクセス</a>
  </div>
  <div class="mid">
    <div class="tagline">畳の小上がり＋6畳・1時間から</div>
    <h1><span class="nb">きょうだけ、</span><br><span class="nb">この家はあなたの店。</span></h1>
    <p class="sub">マッサージ、ネイル、書道、ちいさな教室、ママ会。店を持つ前のプロと、集まりたい人のための一軒家の1階です。</p>
  </div>
  <div class="bar">
    <div class="cell"><b>なにをする？</b><span>施術・レッスン・集まり</span></div>
    <div class="cell"><b>いつ？</b><span>9/6（土）13:00〜</span></div>
    <div class="cell"><b>なんにん？</b><span>3名</span></div>
    <div class="go">空きをさがす</div>
  </div>
</div>
<div class="strip">
  <div class="it"><b>1,000</b><span>円 / 1時間から</span></div>
  <div class="it"><b>6</b><span>名まで</span></div>
  <div class="it"><b>1h</b><span>から予約OK</span></div>
  <div class="it">✓ 宿泊なし・調理なしなので許可不要</div>
</div>
</body></html>
