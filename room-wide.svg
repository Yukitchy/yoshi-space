<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810">
  <defs>
    <style>
      .l{fill:none;stroke:#B8875A;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .t{fill:none;stroke:#B8875A;stroke-width:1.3;opacity:.5}
      .f{fill:#F0E6D4}
      .g{fill:#DCE6CE}
      .w{fill:#FFFDF8}
    </style>
  </defs>

  <rect width="1440" height="810" fill="#FBF5EA"/>
  <!-- wall -->
  <path class="w" d="M0 0h1440v475H0z"/>
  <!-- floor -->
  <path class="f" d="M0 475h1440v335H0z"/>
  <line class="l" x1="0" y1="475" x2="1440" y2="475"/>
  <line class="t" x1="0" y1="521" x2="1440" y2="521"/>

  <!-- extra shoji far left -->
  <rect class="w" x="-10" y="150" width="210" height="290" rx="3"/>
  <rect class="l" x="-10" y="150" width="210" height="290" rx="3"/>
  <g class="t">
    <line x1="95" y1="150" x2="95" y2="440"/>
    <line x1="-10" y1="222" x2="200" y2="222"/>
    <line x1="-10" y1="295" x2="200" y2="295"/>
    <line x1="-10" y1="367" x2="200" y2="367"/>
  </g>

  <g transform="translate(320,145)">
