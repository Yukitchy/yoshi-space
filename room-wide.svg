  <ellipse class="w" cx="196" cy="666" rx="86" ry="24"/>
  <ellipse class="l" cx="196" cy="666" rx="86" ry="24"/>

  <!-- stack of books -->
  <path class="l" d="M1080 596h74v14h-74zM1086 582h64v14h-64zM1092 568h54v14h-54z"/>
